name: Build XML Notepad App Attach image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - '.github/workflows/app-attach.yml'

permissions:
  contents: read

jobs:
  package-and-image:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: NuGet/setup-nuget@v4
      - uses: microsoft/setup-msbuild@v3

      - name: Import signing certificate and match package publisher
        shell: pwsh
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:MSIX_PFX_BASE64 -or -not $env:MSIX_PFX_PASSWORD) {
            throw 'Configure MSIX_PFX_BASE64 and MSIX_PFX_PASSWORD as repository secrets before building.'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'xmlnotepad-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MSIX_PFX_BASE64))
            $password = ConvertTo-SecureString $env:MSIX_PFX_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (-not $certificate -or -not $certificate.HasPrivateKey) {
              throw 'The signing PFX must contain a certificate and its private key.'
            }
            $manifestPath = 'src/XmlNotepadPackage/Package.appxmanifest'
            [xml]$manifest = Get-Content -LiteralPath $manifestPath -Raw
            $manifest.Package.Identity.Publisher = $certificate.Subject
            $manifest.Save((Join-Path $PWD $manifestPath))
            "MSIX_CERT_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          }
          finally {
            Remove-Item -LiteralPath $pfx -ErrorAction SilentlyContinue
          }

      - name: Restore dependencies
        shell: pwsh
        run: nuget restore .\src\xmlnotepad.sln

      - name: Build and sign MSIX bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          trap {
            $message = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=MSIX build::$message"
            break
          }
          function Assert-BuildSucceeded($exitCode, $log, $label) {
            if ($exitCode -eq 0) { return }
            if (Test-Path -LiteralPath $log) {
              Select-String -LiteralPath $log -Pattern ': error |error (MSB|CS|NETSDK|APPX|PRI|MC|NU)\d+' |
                Select-Object -Last 8 | ForEach-Object {
                  $message = $_.Line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                  Write-Output "::error title=$label::$message"
                }
            }
            throw "$label failed with exit code $exitCode."
          }
          Set-Content -Path .\src\Model\ApiKey.cs -Value 'namespace XmlNotepad { public partial class AppAnalytics { private const string ApiKey=""; } }'
          $solutionLog = Join-Path $env:RUNNER_TEMP 'solution-build.log'
          msbuild .\src\xmlnotepad.sln /t:Build /p:Configuration=Release "/p:Platform=Any CPU" /verbosity:minimal "/flp:logfile=$solutionLog;verbosity=normal"
          Assert-BuildSucceeded $LASTEXITCODE $solutionLog 'Release solution build'
          foreach ($prerequisite in @('.\src\FontBuilder\bin\Release\FontBuilder.dll', '.\src\XmlStats\bin\Release\XmlStats.exe')) {
            if (-not (Test-Path -LiteralPath $prerequisite -PathType Leaf)) { throw "Missing packaging prerequisite: $prerequisite" }
          }
          $packageLog = Join-Path $env:RUNNER_TEMP 'package-build.log'
          msbuild .\src\XmlNotepadPackage\XmlNotepadPackage.wapproj /t:Build /p:Configuration=Release /p:Platform=AnyCPU /p:TargetPlatformVersion=10.0.26100.0 /p:GenerateAppxPackageOnBuild=true /p:AppxBundle=Always /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageSigningEnabled=true "/p:PackageCertificateThumbprint=$env:MSIX_CERT_THUMBPRINT" /verbosity:minimal "/flp:logfile=$packageLog;verbosity=normal"
          Assert-BuildSucceeded $LASTEXITCODE $packageLog 'MSIX package build'

      - name: Create App Attach CIM from signed MSIX bundle
        id: image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          trap {
            $message = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=CIM packaging::$message"
            break
          }
          $bundles = @(Get-ChildItem 'src/XmlNotepadPackage/AppPackages' -Recurse -File -Filter '*.msixbundle')
          if ($bundles.Count -ne 1) { throw "Expected one MSIX bundle; found $($bundles.Count)." }
          $bundle = $bundles[0]
          $certificate = Get-Item "Cert:\CurrentUser\My\$env:MSIX_CERT_THUMBPRINT"
          $signature = Get-AuthenticodeSignature -LiteralPath $bundle.FullName
          if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint) {
            throw 'The produced bundle is not signed with the configured certificate.'
          }
          $archive = [IO.Compression.ZipFile]::OpenRead($bundle.FullName)
          try {
            $entry = $archive.GetEntry('AppxMetadata/AppxBundleManifest.xml')
            if (-not $entry) { throw 'The signed bundle has no bundle manifest.' }
            $reader = [IO.StreamReader]::new($entry.Open())
            try { [xml]$bundleManifest = $reader.ReadToEnd() }
            finally { $reader.Dispose() }
          }
          finally { $archive.Dispose() }
          [xml]$sourceManifest = Get-Content -LiteralPath 'src/XmlNotepadPackage/Package.appxmanifest' -Raw
          if ($bundleManifest.Bundle.Identity.Publisher -cne $certificate.Subject -or
              $bundleManifest.Bundle.Identity.Name -cne $sourceManifest.Package.Identity.Name -or
              $bundleManifest.Bundle.Identity.Version -cne $sourceManifest.Package.Identity.Version) {
            throw 'The signed bundle identity differs from the configured publisher or source manifest.'
          }
          $zip = Join-Path $env:RUNNER_TEMP 'msixmgr.zip'
          $tools = Join-Path $env:RUNNER_TEMP 'msixmgr'
          Invoke-WebRequest 'https://aka.ms/msixmgr' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $tools
          $executables = @(Get-ChildItem $tools -Recurse -File -Filter 'msixmgr.exe' | Where-Object { $_.FullName -match '[\\/]x64[\\/]' })
          if ($executables.Count -ne 1) { throw "Expected one x64 MSIXMGR executable; found $($executables.Count)." }
          $output = Join-Path $env:RUNNER_TEMP 'app-attach'
          $cimDirectory = Join-Path $output 'appattach'
          New-Item -ItemType Directory -Path $cimDirectory -Force | Out-Null
          $image = Join-Path $cimDirectory 'XmlNotepad.cim'
          & $executables[0].FullName -Unpack -packagePath $bundle.FullName -destination $image -applyACLs -create -fileType CIM -rootDirectory apps
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $image -PathType Leaf)) { throw 'MSIXMGR did not create the CIM image.' }
          $files = @(Get-ChildItem -LiteralPath $cimDirectory -File)
          $companions = @($files | Where-Object { $_.Name -ne 'XmlNotepad.cim' })
          $ids = @($companions | ForEach-Object {
            $match = [regex]::Match($_.Name, '^(objectid|region)_([0-9a-fA-F-]{36})_(\d+)$')
            if (-not $match.Success) { throw "Unexpected CIM companion: $($_.Name)" }
            $match.Groups[2].Value.ToLowerInvariant()
          } | Select-Object -Unique)
          if ($ids.Count -ne 1 -or @($companions | Where-Object Name -Like 'objectid_*').Count -eq 0 -or
              @($companions | Where-Object Name -Like 'region_*').Count -eq 0) {
            throw 'The CIM descriptor must have both objectid and region companions with one identifier.'
          }
          $descriptor = [IO.File]::ReadAllBytes($image)
          if ($descriptor.Length -lt 48 -or [Text.Encoding]::ASCII.GetString($descriptor, 0, 8) -ne 'cimfile0' -or
              ([Guid]::new([byte[]]$descriptor[32..47])).ToString() -ne $ids[0]) {
            throw 'The CIM descriptor does not match its companion files.'
          }
          if (@($files | Where-Object Length -EQ 0).Count -gt 0) { throw 'A CIM file is empty.' }
          $objectIds = @($companions | Where-Object Name -Like 'objectid_*' | ForEach-Object { $_.Name.Split('_')[-1] } | Sort-Object)
          $regions = @($companions | Where-Object Name -Like 'region_*' | ForEach-Object { $_.Name.Split('_')[-1] } | Sort-Object)
          if (@(Compare-Object $objectIds $regions).Count -gt 0) { throw 'CIM objectid and region indexes differ.' }
          Copy-Item -LiteralPath $bundle.FullName -Destination $output
          Get-ChildItem $output -Recurse -File | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash, $_.FullName.Substring($output.Length + 1).Replace('\', '/')
          } | Set-Content -Path (Join-Path $output 'SHA256SUMS.txt')
          "path=$output" >> $env:GITHUB_OUTPUT
          "cim=$image" >> $env:GITHUB_OUTPUT
          "msixmgr=$($executables[0].FullName)" >> $env:GITHUB_OUTPUT
          "publisher=$($certificate.Subject)" >> $env:GITHUB_OUTPUT
          "packageName=$($sourceManifest.Package.Identity.Name)" >> $env:GITHUB_OUTPUT

      - name: Validate CIM staging and package folder ACLs
        shell: powershell
        env:
          CIM_PATH: ${{ steps.image.outputs.cim }}
          MSIXMGR_PATH: ${{ steps.image.outputs.msixmgr }}
          PACKAGE_PUBLISHER: ${{ steps.image.outputs.publisher }}
          PACKAGE_NAME: ${{ steps.image.outputs.packageName }}
        run: |
          try {
            & .\.github\scripts\test-cim-stage.ps1 -ImagePath $env:CIM_PATH `
              -MsixMgrPath $env:MSIXMGR_PATH `
              -ExpectedPublisher $env:PACKAGE_PUBLISHER `
              -ExpectedPackageName $env:PACKAGE_NAME
          }
          catch {
            $message = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=CIM staging::$message"
            throw
          }

      - name: Upload signed bundle and complete App Attach CIM
        uses: actions/upload-artifact@v4
        with:
          name: xmlnotepad-app-attach-${{ github.sha }}
          path: ${{ steps.image.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
